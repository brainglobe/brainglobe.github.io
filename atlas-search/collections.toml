# Atlas collections shown on the search site.
#
# This file is the source of the human-written titles, categories and
# descriptions of every atlas. It is maintained by hand: when a new atlas is
# added to the BrainGlobe bucket, add its key to an existing collection or add
# a new [[collection]] entry below, then rebuild the index
# (`python scripts/build_index.py`). The index build warns about atlases in
# the bucket that are not listed here.
#
# Fields:
#   title        display name of the collection (required)
#   group        category, one of: Mouse, Rat, Other rodent, Fish, Lizard,
#                Amphibian, Human and non-human primate, Other mammal, Bird,
#                Invertebrate (required; sets the order of search results)
#   link         homepage or paper for the atlas (optional)
#   atlases      atlas keys as in last_versions.conf, e.g. "allen_mouse_25um"
#                (required)
#   description  plain text; separate paragraphs with a blank line. URLs are
#                turned into links on the site. (optional)

[[collection]]
title = "Allen Adult Mouse Brain Atlas"
group = "Mouse"
link = "https://doi.org/10.1016/j.cell.2020.04.007"
atlases = [
  "allen_mouse_10um",
  "allen_mouse_25um",
  "allen_mouse_50um",
  "allen_mouse_100um",
]
description = '''
For many researchers working with mice, this is the "default" atlas for a variety of tasks. It is also the basis for the most commonly used common coordinate space (CCFv3). It is usually the best mouse atlas to start with, but it has some disadvantages. It has a reference image based on STP, which may not produce the best results for other imaging modalities, and you may want to try atlases based on other modalities (see below). It also has limited annotations in some regions (alternatives such as the Enhanced and Unified Mouse Brain Atlas may be better if the Allen Adult Mouse Brain Atlas is not annotated sufficiently).
'''

[[collection]]
title = "Enhanced and Unified Mouse Brain Atlas"
group = "Mouse"
link = "https://kimlab.io/brain-map/atlas/"
atlases = [
  "kim_mouse_10um",
  "kim_mouse_25um",
  "kim_mouse_50um",
  "kim_mouse_100um",
]
description = '''
This atlas from Chon et al. (2019) is very similar to the Allen Adult Mouse Brain Atlas (it has the same reference image), but it includes additional annotations (e.g. from the Franklin-Paxinos atlas). This atlas may be a good choice for those brain regions not annotated sufficiently in the Allen Adult Mouse Brain Atlas.
'''

[[collection]]
title = "Enhanced and Unified Mouse Brain Atlas v2"
group = "Mouse"
link = "https://figshare.com/articles/dataset/Unified_mouse_brain_atlas_v2/25750983"
atlases = [
  "kim_mouse_isotropic_20um",
]
description = '''
The updated version of the Unified Mouse Brain Atlas builds upon the work of Chon et al. (2019), which introduced a more finely segmented adult mouse brain atlas with unified anatomical labeling based on the Allen Common Coordinate Framework (CCF). The original atlas integrated the Franklin-Paxinos (FP) labels into the CCF space, providing consistent and detailed segmentation across brain regions.

Version 2 (2024) contains several key improvements: * Corrected anatomical labels and updated ontology file to resolve inconsistencies in the original release. * 20 µm isotropic label volume generated via shape interpolation for high-resolution anatomical accuracy. * Maintains full compatibility with the original atlas (coordinate space and ontology).
'''

[[collection]]
title = "Gubra's LSFM mouse brain atlas"
group = "Mouse"
link = "https://doi.org/10.1007/s12021-020-09490-8"
atlases = [
  "perens_lsfm_mouse_20um",
]
description = '''
This atlas from Perens et al. (2020) provides a version of the Allen Adult Mouse Brain Atlas, based on solvent-cleared brains imaged with LSFM. This atlas may be a good choice for registering other similar images. However, please note that this atlas is in a different coordinate space to the original Allen atlas (CCFv3). We recommend instead using the second version of this atlas, Gubra's LSFM mouse brain atlas v2.
'''

[[collection]]
title = "Gubra's MRI mouse brain atlas"
group = "Mouse"
link = "https://doi.org/10.1007/s12021-023-09623-9"
atlases = [
  "perens_stereotaxic_mri_mouse_25um",
]
description = '''
This atlas is an addition to its LSFM version and provides a version of the Allen Adult Mouse Brain Atlas, based on T2-weighted MRI. This atlas may be a good choice for registering other similar images. However, please note that this atlas is in a different coordinate space to the original Allen atlas (CCFv3). In addition this atlas is in flat skull position and so it can be used to plan stereotaxic surgeries.
'''

[[collection]]
title = "Gubra's LSFM mouse brain atlas v2"
group = "Mouse"
link = "https://doi.org/10.1007/s12021-023-09623-9"
atlases = [
  "perens_multimodal_lsfm_25um",
]
description = '''
This atlas is an addition to its MRI version and provides a version of the Allen Adult Mouse Brain Atlas, based on LSFM. This atlas may be a good choice for registering other similar images. This atlas is the second version of perens et al. (2020) and was published in perens et al. (2023). Please note that this atlas is in a different coordinate space to the original Allen atlas (CCFv3) and to Perens 2020.
'''

[[collection]]
title = "Princeton Mouse Brain Atlas"
group = "Mouse"
link = "https://brainmaps.princeton.edu/2020/09/princeton-mouse-brain-atlas-links"
atlases = [
  "princeton_mouse_20um",
]
description = '''
This atlas from Pisano et al. (2021) is a version of the Allen Adult Mouse Brain Atlas with two main differences. Unlike the Allen Adult Mouse Brain Atlas it includes a full cerebellum, and the reference image is based on LSFM rather than STP.
'''

