description = '''
This atlas tracks brain development in the mouse at 7 timepoints (P3, P5, P7, P9, P12, P14, P21). Each template is averaged from 20 to 30 LSFM images of iDISCO+ cleared brains of either sex, which were then aligned to an averaged in-vivo MRI scan of three mice per timepoint to correct for any ex-vivo deformation. This is useful for researchers seeking to study the in-vivo volumetric changes of the brain during development. Annotations are based on the CCFv3 Allen annotations.
'''

[[collection]]
title = "Allen CCFv1 Mouse Brain Atlas"
group = "Mouse"
link = "https://doi.org/10.1038/nature05453"
atlases = [
  "ccfv1_mouse_25um",
]
description = '''
This is the first edition of the mouse brain atlas in the commonly used Allen Common Coordinate Framework, which is included here for historical reasons. The template is based on the 528 Nissl-stained coronal slices from a male P56 mouse brain frozen in OCT, which was annotated only on the left hemisphere based on the Allen Reference Atlas. This atlas provides a common coordinate framework for many other useful mouse atlases and data based on CCFv1.
'''

[[collection]]
title = "Waxholm Space atlas of the Sprague Dawley rat brain"
group = "Rat"
link = "https://doi.org/10.1038/s41592-023-02034-3"
atlases = [
  "whs_sd_rat_39um",
]
description = '''
The Waxholm Space rat brain atlas features annotations of 222 structures, alongside a 39μm MRI template. It provides detailed delineations of the cerebral cortex, hippocampus, striatopallidal areas, midbrain, thalamus, auditory system and fiber tracts. It is comprehensive, covering the entire rat brain.
'''

[[collection]]
title = "SWC Female Rat Brain Atlas"
group = "Rat"
link = "https://brainglobe.info/blog/swc-female-rat-atlas.html#native-female-rat-atlas"
atlases = [
  "swc_female_rat_50um",
]
description = '''
This atlas is a population-based anatomical template generated from female Lister Hooded rats (5–8 weeks old) using automated serial two-photon tomography. It provides a three-dimensional template derived from juvenile female animals, addressing gaps in both resolution and biological diversity in existing rat atlases. The atlas is particularly well suited for users who want to work in a native, microscopy-derived female rat brain space. The annotations are curated and adapted from the Waxholm Space rat brain atlas.
'''

[[collection]]
title = "Waxholm-aligned SWC Female Rat Atlas"
group = "Rat"
link = "https://brainglobe.info/blog/swc-female-rat-atlas.html#waxholm-space-registered-female-rat-atlas"
atlases = [
  "whs_sd_swc_female_rat_39um",
]
description = '''
To support interoperability with existing rat resources, this atlas provides a version of the SWC female rat template registered to Waxholm Space. The template is resampled from 50μm to 39μm during registration to Waxholm Space, enabling direct comparison and integration with datasets and tools that already rely on Waxholm Space, while retaining the fine anatomical detail of the SWC template. The annotations are from the Waxholm Space rat brain atlas.
'''

[[collection]]
title = "Duke Developmental Rat Brain Atlas"
group = "Rat"
link = "https://doi.org/10.1016/j.neuroimage.2013.01.017"
