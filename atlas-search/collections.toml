title = "Australian Mouse Brain Atlas"
group = "Mouse"
link = "https://imaging.org.au/AMBMC/"
atlases = [
  "australian_mouse_15um",
]
description = '''
This atlas has a very high resolution (15μm) MRI template. It covers the Hippocampus, Cerebellum, Cortex, Basal Ganglia, and Diencephalon. It is quite consistent with the parcellation scheme of the Paxinos and Franklin mouse brain atlas. At present a drawback of this atlas is that the segmentations do not cover the entire brain and is limited to the regions previously mentioned.
'''

[[collection]]
title = "CCFv3 augmented mouse atlas"
group = "Mouse"
link = "https://doi.org/10.1162/imag_a_00565"
atlases = [
  "ccfv3augmented_mouse_10um",
  "ccfv3augmented_mouse_25um",
]
description = '''
This atlas is an extended version of the CCFv3, designed to cover the rostral and caudal tips of the mouse brain. This atlas is particularly useful for users who require the whole brain to be represented including the posterior third of the cerebellum, the brainstem, and the anterior olfactory bulb. It includes two Nissl reference templates, one which is a population average from hundreds of mice and one based on three animals. The Nissl template included in the CCFv3 is slightly misaligned, here the Nissl template has been more precisely registered into the CCFv3 space. The CCFv3 Augmented also includes new delineations of the granular layer of the cerebellum.
'''

