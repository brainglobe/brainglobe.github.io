  "duke_dev_rat_p80_25um",
]
description = '''
These atlases from Calabrese et al. (2013) were obtained from 5 specimens each from 9 different time points using a 7T MRI. The earliest 5 timepoints were registered to the Ashwell and Paxinos neonatal rat atlas and the last 4 timepoints were registered to the Paxinos and Watson adult rat atlas to give a consistent view of the structural changes that occur over development.

These atlases are only available at 25μm resolution:
'''

