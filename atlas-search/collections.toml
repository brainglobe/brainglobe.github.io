[[collection]]
title = "Dorr MRI Mouse Atlas"
group = "Mouse"
link = "https://doi.org/10.1016/j.neuroimage.2008.03.037"
atlases = [
  "dorr_mouse_mri_32um",
]
description = '''
This atlas is a high-resolution, three-dimensional MRI-based atlas of the adult C57Bl/6J mouse brain, providing comprehensive anatomical coverage of the cerebrum, cerebellum, and brainstem. The atlas was constructed from within-skull, T2-weighted MR images acquired at 32 μm isotropic resolution from forty 12-week-old mice scanned on a 7 T scanner. Following normalisation, registration, and averaging of individual scans, 62 distinct brain structures were manually delineated.
'''

[[collection]]
title = "Duke Mouse Brain Atlas"
group = "Mouse"
link = "https://doi.org/10.1126/sciadv.adq8089"
atlases = [
  "duke_mouse_15um",
  "duke_mouse_25um",
  "duke_mouse_50um",
  "duke_mouse_75um",
  "duke_mouse_100um",
  "duke_mouse_150um",
]
description = '''
This atlas from Mansour et al. (2025) is a 15 μm isotropic MRH-based stereotaxic atlas of the adult C57BL/6J mouse brain. The source atlas was built from five 90 ± 2 day male mice scanned in skull, limiting tissue deformation from cranial dissection and conventional histology. Micro-CT images of the skull provide bregma and lambda landmarks in the same stereotaxic space.

BrainGlobe includes the mean diffusivity template as the main reference image, the source annotation image, generated meshes, and 11 additional registered reference images. RCCFv3 is the Duke team's reduced version of the Allen CCFv3 label set, in which related structures smaller than 0.1 mm<sup>3</sup> are grouped into larger regions to reduce registration noise from small structures.
'''

[[collection]]
title = "CArea Mouse Atlas"
group = "Mouse"
link = "https://doi.org/10.64898/2026.01.20.700446"
atlases = [
  "carea_mouse_25um",
]
description = '''
This atlas has regions which are automatically clustered based on three dimensional maps of gene expression. Voxels with similar patterns of gene expression are assigned the same region ID. The template is a population average Nissl volume, based on the CCFv3BBP atlas (also in BrainGlobe) with some improvements. This atlas was constructed from reregistered ISH data from the Allen Institute for Brain Science.
'''

[[collection]]
title = "Allen CCFv2 Mouse Brain Atlas"
group = "Mouse"
link = "https://doi.org/10.1038/nature13186"
atlases = [
  "ccfv2_mouse_25um",
]
description = '''
This is a mouse brain atlas using version 2 of the commonly used Allen Common Coordinate Framework, which is included here for historical reasons. The template is based on 528 Nissl-stained coronal slices from the mouse specimen used in the Allen Reference Atlas. This atlas annotates the grey matter and ventricular systems of the mouse brain. This atlas provides a common coordinate framework for many other useful mouse atlases based on CCFv2. Note that the additional reference is an average template based on serial two-photon tomography, and is misaligned with the original Nissl template.
'''

[[collection]]
title = "Allen CCFv2 Mouse Fiber Tracts Atlas"
group = "Mouse"
link = "https://doi.org/10.1038/nature13186"
atlases = [
  "ccfv2_fiber_mouse_25um",
]
description = '''
This is a mouse brain fiber tract atlas using version 2 of the commonly used Allen Common Coordinate Framework. Where the CCFv2 Mouse Brain atlas only provides information on the grey matter and ventricular systems of the mouse brain, this atlas contains fiber tract structural annotation information. as delineated in the Allen Reference Atlas. The template is based on 528 Nissl-stained coronal slices from the mouse specimen used in the Allen Reference Atlas. Note that the additional reference is an average template based on serial two-photon tomography, and is misaligned with the original Nissl template.
'''

[[collection]]
title = "Allen CCFv2 Developmental Mouse Brain Atlas"
group = "Mouse"
link = "https://doi.org/10.1038/nature13186"
atlases = [
  "ccfv2_dev_mouse_25um",
]
description = '''
This is a developmental mouse brain atlas using version 2 of the commonly used Allen Common Coordinate Framework. The template is based on 528 Nissl-stained coronal slices from the mouse specimen used in the Allen Reference Atlas. The annotations contain the developmental taxonomy of mouse brain structures as given in the Allen Developing Mouse Brain atlas. Note that the additional reference is an average template based on serial two-photon tomography, and is misaligned with the original Nissl template.
'''

