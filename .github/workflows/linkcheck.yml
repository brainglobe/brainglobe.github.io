name: Check documentation links

on:
  # TEMPORARY: remove after testing on PR #560, before merging.
  push:
    branches:
      - link-check-cron
  schedule:
    # Every Wednesday at 06:30 UTC.
    - cron: '30 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    # Allow manual runs on forks, but only schedule checks upstream.
    if: github.event_name != 'schedule' || github.repository == 'brainglobe/brainglobe.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check links
        id: linkcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C docs linkcheck
      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: docs/build/linkcheck/
          retention-days: 30
      - name: Summarize failure
        if: failure() && steps.linkcheck.outcome == 'failure'
        run: |
          echo 'Link checking failed. Review the Check links logs and download the linkcheck-report artifact (if available) to verify broken links manually.' >> "$GITHUB_STEP_SUMMARY"
      # TEMPORARY: remove this step after testing, before merging.
      - name: Force failure to test Slack
        if: github.event_name == 'push'
        run: exit 1
      - name: Notify Slack on scheduled or test failure
        # TEMPORARY: restore the schedule-only condition after testing.
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          notify_when: 'failure'
          # TEMPORARY: restore the normal notification title after testing.
          notification_title: 'TEST: documentation link-check alert'
          message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>. Review the logs and the linkcheck-report artifact (if available) for details.'
          footer: '<{run_url}|View run and download linkcheck report>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFYBOT_WEBHOOK_URL }}
